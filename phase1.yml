name: phase1-checks

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Past trading day for accuracy suite (YYYY-MM-DD)"
        required: true
        default: "2026-11-03"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all suites
        run: python phase1_checks.py all --label github-actions --date "${{ github.event.inputs.date }}"
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: results/
