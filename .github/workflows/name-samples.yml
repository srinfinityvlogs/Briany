name: name-samples

on:
  workflow_dispatch:
    inputs:
      day:
        description: "A published trading day (YYYY-MM-DD) to measure name coverage against"
        required: true
        default: "2026-11-18"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture the candidate name lists and measure coverage
        env:
          IN_DAY: ${{ github.event.inputs.day }}
        run: python -m briany.name_samples --day "$IN_DAY"
      - name: Save samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-samples
          path: samples/names/
