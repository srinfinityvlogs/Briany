name: ingest-prices

on:
  schedule:
    - cron: "30 14 * * 1-5"      # 20:00 IST Mon-Fri (GitHub may start scheduled runs hours late)
    - cron: "30 21 * * 1-5"      # 03:00 IST Tue-Sat: safety net so data is in before the 9:15 open
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date YYYY-MM-DD (leave empty for the last 7 days)"
        required: false
        default: ""
      end:
        description: "Backfill end date YYYY-MM-DD (empty = same as start)"
        required: false
        default: ""
      check:
        description: "Type yes for a read-only report on what is stored (instead of ingesting)"
        required: false
        default: "no"
      refresh_actions:
        description: "Type yes to refresh the stored corporate-actions copy (instead of ingesting)"
        required: false
        default: "no"
      rebuild_jumps:
        description: "Type yes to recompute large-move records from stored days (instead of ingesting)"
        required: false
        default: "no"
      purge_legacy:
        description: "One-time cleanup of the old px:* keys (type yes to run it instead of ingesting)"
        required: false
        default: "no"

concurrency:
  group: ingest-prices
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ingest.txt
      - name: Ingest end-of-day files
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_PURGE: ${{ github.event.inputs.purge_legacy }}
          IN_CHECK: ${{ github.event.inputs.check }}
          IN_REBUILD: ${{ github.event.inputs.rebuild_jumps }}
          IN_REFRESH: ${{ github.event.inputs.refresh_actions }}
          REDIS_MAX_MEMORY_MB: "30"     # Upstash free plan via Vercel; the server does not report it
        run: |
          if [ "$IN_CHECK" = "yes" ]; then
            python -m briany.ingest --check
          elif [ "$IN_REFRESH" = "yes" ]; then
            python -m briany.ingest --refresh-actions
          elif [ "$IN_REBUILD" = "yes" ]; then
            python -m briany.ingest --rebuild-jumps
          elif [ "$IN_PURGE" = "yes" ]; then
            python -m briany.ingest --purge-legacy
          elif [ -n "$IN_START" ]; then
            python -m briany.ingest --start "$IN_START" --end "${IN_END:-$IN_START}"
          else
            python -m briany.ingest --recent 7; rc1=$?
            python -m briany.ingest --refresh-actions; rc2=$?
            exit $(( rc1 || rc2 ))
          fi
