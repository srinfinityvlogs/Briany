name: news-samples

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture Google News RSS samples
        run: python -m briany.news_samples
      - name: Save samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-samples
          path: news_samples/
