name: phase1-checks

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Past trading days for accuracy suite, comma-separated (YYYY-MM-DD)"
        required: true
        default: "2026-11-03,2026-11-02,2026-10-30"

      gemini_model:
        description: "Optional Gemini model id (leave empty to auto-pick)"
        required: false
        default: ""
      groq_model:
        description: "Optional Groq model id (leave empty to auto-pick)"
        required: false
        default: ""
      chain_order:
        description: "chain suite provider order, e.g. gemini,groq or groq,gemini"
        required: false
        default: "gemini,groq"
      cases:
        description: "LLM suite only: comma-separated case ids to run (empty = all), e.g. W3,W4,W5"
        required: false
        default: ""
      suites:
        description: "Suite name or 'all'"
        required: true
        default: "all"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all suites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model }}
          LLM_CASES: ${{ github.event.inputs.cases }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.groq_model }}
          CHAIN_ORDER: ${{ github.event.inputs.chain_order }}
        run: python phase1_checks.py "${{ github.event.inputs.suites }}" --label github-actions --date "${{ github.event.inputs.date }}"
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: results/
