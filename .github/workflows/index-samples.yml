name: index-samples

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Trading day(s) YYYY-MM-DD, comma separated for several"
        required: true
        default: "2026-11-20,2026-11-13,2026-10-20,2026-08-20,2026-05-20,2025-12-31,2025-11-20"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture the candidate index sources
        env:
          IN_DAY: ${{ github.event.inputs.day }}
        run: python -m briany.index_samples --day "$IN_DAY"
      - name: Save samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-samples
          path: samples/indices/
